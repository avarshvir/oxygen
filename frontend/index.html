<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oxygen AI Team</title>
    <!-- Bootstrap CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

<div class="container-fluid h-100 p-3">
    <div class="row h-100">
        
        <!-- LEFT PANEL: 2D Virtual Office Canvas -->
        <div class="col-md-8 d-flex flex-column">
            <div class="card shadow-sm flex-grow-1">
                <div class="card-header bg-dark text-white">
                    <h5 class="mb-0">🏢 Oxygen Virtual Office</h5>
                </div>
                <div class="card-body p-0 d-flex justify-content-center align-items-center bg-secondary">
                    <!-- The game engine / pixel art will render inside this canvas -->
                    <canvas id="officeCanvas" width="800" height="600"></canvas>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL: Chat with Project Manager -->
        <div class="col-md-4 d-flex flex-column">
            <div class="card shadow-sm flex-grow-1 d-flex flex-column">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">💬 Chat with Project Manager</h5>
                </div>
                
                <!-- Chat History Area -->
                <div class="card-body overflow-auto chat-box" id="chatHistory">
                    <div class="mb-2 text-start">
                        <span class="badge bg-primary">Project Manager</span>
                        <p class="border rounded p-2 mt-1 bg-light">Hello! I'm your AI Project Manager. What are we building today?</p>
                    </div>
                </div>
                
                <!-- Input Area -->
                <div class="card-footer">
                    <div class="input-group">
                        <textarea class="form-control" id="userInput" rows="2" placeholder="Describe your project requirements..."></textarea>
                        <button class="btn btn-primary" id="sendBtn">Send</button>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Bootstrap JS (Optional, but good for interactive components if needed later) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- Your custom JS -->
<script src="js/main.js"></script>
<script src="js/socket.js"></script>
</body>
</html>
